      <text x="48" y="498" fill="#E2E8F0" font-family="JetBrains Mono, monospace" font-size="11">9f86d081884c7d659a2feaa0c55ad015</text>
      <text x="48" y="516" fill="#E2E8F0" font-family="JetBrains Mono, monospace" font-size="11">a3bf4f1b2b0b822cd15d6c15b0f00a08</text>


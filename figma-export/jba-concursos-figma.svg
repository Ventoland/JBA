      <rect x="40" y="434" width="460" height="46" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
      <text x="56" y="462" fill="#334155" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14">mariana.vasconcelos@email.com.br</text>

      <text x="520" y="422" fill="#0B1B3D" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="700">Município / UF *</text>

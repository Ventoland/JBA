      <text x="32" y="274" fill="#FFFFFF" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="14" font-weight="700">Edital nº 001/2025 — Pref. Santa Clara do Sul</text>

      <text x="32" y="318" fill="#94A3B8" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="12">CARGO PÚBLICO</text>

      <text x="24" y="102" fill="#0B1B3D" font-family="Cinzel, Georgia, serif" font-size="18" font-weight="700">Monte Verde</text>
      <text x="24" y="138" fill="#334155" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="13">• Cargos: Procurador Legislativo, Contador, Controle</text>
      <text x="24" y="162" fill="#334155" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="13">• Remuneração: até R$ 11.200,00</text>
      <text x="24" y="186" fill="#334155" font-family="Plus Jakarta Sans, Inter, sans-serif" font-size="13">• Prova Objetiva &amp; Discursiva: 05/10/2025</text>
